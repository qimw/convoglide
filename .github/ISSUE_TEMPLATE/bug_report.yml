name: Bug report
description: Report a reproducible bug in ConvoGlide
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: install_path
    attributes:
      label: Install path
      options:
        - Userscript
        - Browser extension
        - Developer local run
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Problem type
      options:
        - Slow first load
        - Slow after load
        - Install issue
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 136, Edge 136, etc.
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: What did you do, and what happened?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Logs, screenshots, or extra notes
