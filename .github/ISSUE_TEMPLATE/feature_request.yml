name: Feature request
description: Suggest an improvement for ConvoGlide
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like ConvoGlide to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Userscript
        - Browser extension
        - Benchmarking
        - Documentation
        - Future site adapters
        - Other
