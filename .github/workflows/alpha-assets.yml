name: Alpha Assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build alpha assets
        run: npm run package:alpha

      - name: Verify alpha assets
        run: npm run verify:package

      - name: Upload alpha assets
        uses: actions/upload-artifact@v4
        with:
          name: convoglide-alpha-assets
          path: dist/
