<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ConvoGlide install paths</title>
  <desc id="desc">Overview of the three main ways to install or try ConvoGlide: userscript, browser extension, and developer setup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5FBF8"/>
      <stop offset="1" stop-color="#EDF4FB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#173A54" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="32" fill="url(#bg)"/>

  <text x="76" y="90" fill="#12324A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700">
    Install ConvoGlide
  </text>
  <text x="76" y="130" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">
    Three paths, one goal: get a long ChatGPT thread under control as fast as possible.
  </text>

  <rect x="76" y="184" width="324" height="376" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="438" y="184" width="324" height="376" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="800" y="184" width="324" height="376" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="108" y="242" fill="#18794E" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">
    Fastest for most users
  </text>
  <text x="108" y="286" fill="#12324A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800">
    Userscript
  </text>
  <text x="108" y="338" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    1. Install Tampermonkey or Violentmonkey
  </text>
  <text x="108" y="374" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    2. Open the raw install URL
  </text>
  <text x="108" y="410" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    3. Reload a long ChatGPT thread
  </text>
  <text x="108" y="484" fill="#12324A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">
    Best when you just want it working.
  </text>

  <text x="470" y="242" fill="#2A5CAA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">
    Best for side-loading
  </text>
  <text x="470" y="286" fill="#12324A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800">
    Extension
  </text>
  <text x="470" y="338" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    1. Download the latest release zip
  </text>
  <text x="470" y="374" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    2. Unzip it somewhere local
  </text>
  <text x="470" y="410" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    3. Load unpacked in Chrome or Edge
  </text>
  <text x="470" y="484" fill="#12324A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">
    Best when you prefer extension packaging.
  </text>

  <text x="832" y="242" fill="#7A4B14" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">
    Best for contributors
  </text>
  <text x="832" y="286" fill="#12324A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800">
    Developer
  </text>
  <text x="832" y="338" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    1. Build the runtime locally
  </text>
  <text x="832" y="374" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    2. Launch the dedicated Chrome profile
  </text>
  <text x="832" y="410" fill="#4C6679" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    3. Run benchmark lanes and probes
  </text>
  <text x="832" y="484" fill="#12324A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">
    Best when you want to measure and iterate.
  </text>

  <rect x="76" y="590" width="1048" height="10" rx="5" fill="#DDE7F0"/>
  <rect x="76" y="590" width="318" height="10" rx="5" fill="#2A7A4B"/>
  <rect x="438" y="590" width="318" height="10" rx="5" fill="#2A5CAA"/>
  <rect x="800" y="590" width="324" height="10" rx="5" fill="#B06A18"/>
</svg>
